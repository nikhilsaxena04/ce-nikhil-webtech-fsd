<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home</title>

    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f6f6f6; color: #222; }
      .wrap { max-width: 760px; margin: 24px auto; padding: 0 16px; text-align: center; }
      .logo-corner { position: fixed; top: 10px; right: 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 4px; }
      .logo-corner img { width: 34px; height: 34px; display: block; }
      nav { display: flex; justify-content: center; gap: 14px; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
      nav a { text-decoration: none; color: #222; }
      main { margin-top: 16px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
      img { width: 100%; max-width: 600px; height: auto; border-radius: 8px; }
    </style>
    
  </head>
  <body>
    <a class="logo-corner" href="https://www.abes.ac.in/" target="_blank" rel="noreferrer">
      <img src="https://www.google.com/s2/favicons?sz=64&domain=abes.ac.in" alt="ABES logo" />
    </a>

    <div class="wrap">
      <nav>
        <a href="/">Home</a>
        <a href="/courses">Courses</a>
        <a href="/login">Login</a>
      </nav>

      <main>
        <h1>Home Page</h1>
        <p>Welcome</p>
        <img src="https://picsum.photos/600/350" alt="Random image" />
      </main>
    </div>

  </body>
</html>
