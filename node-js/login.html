<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <style>
      body { margin: 0; font-family: Arial, sans-serif; background: #f6f6f6; color: #222; }
      .wrap { max-width: 760px; margin: 24px auto; padding: 0 16px; text-align: center; }
      nav { display: flex; justify-content: center; gap: 14px; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
      nav a { text-decoration: none; color: #222; }
      main { margin-top: 16px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
      form { max-width: 280px; margin: 0 auto; }
      input { display: block; width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 8px; }
      button { width: 100%; padding: 8px; }
    </style>
  </head>
  <body>
    
    <div class="wrap">
      <nav>
        <a href="/">Home</a>
        <a href="/courses">Courses</a>
        <a href="/login">Login</a>
      </nav>

      <main>
        <h1>Login Page</h1>

        <form>
          <input type="text" placeholder="Username" />
          <input type="password" placeholder="Password" />
          <button type="submit">Login</button>
        </form>

      </main>
    </div>

  </body>
</html>
